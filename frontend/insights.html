<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  // Auth guard — runs before the page renders. No valid session, no access.
  // Also re-checks on bfcache restore (browser back/forward button after
  // logout), which would otherwise show a stale cached page without
  // re-running this script.
  (function () {
    function guardCheck() {
      if (!localStorage.getItem("ib_token")) {
        window.location.replace("login.html");
      }
    }
    guardCheck();
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) guardCheck();
    });
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Insights — InsightBoard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div id="topnav-root"></div>

    <main class="main-content">

      <div id="emptyStateWrap" class="card hidden">
        <div class="empty-state">
          <div class="empty-icon"><i class="fa-solid fa-lightbulb"></i></div>
          <h3>No insights yet</h3>
          <p>Upload a CSV or use the sample dataset to generate plain-English business insights.</p>
          <a href="upload.html" class="btn btn-primary">Upload Dataset</a>
        </div>
      </div>

      <div id="insightsContent" class="hidden">
        <div class="page-head">
          <div>
            <h1>Business Insights</h1>
            <p>Rule-based takeaways generated straight from your dataset — no external AI service involved.</p>
          </div>
        </div>

        <div class="insight-grid" id="insightGrid"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/insights.js"></script>
</body>
</html>
